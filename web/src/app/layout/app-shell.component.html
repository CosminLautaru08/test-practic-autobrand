<div
  class="mx-auto flex min-h-screen w-full max-w-7xl flex-col px-4 py-6 sm:px-6 lg:px-8"
>
  <header
    class="mb-6 overflow-hidden rounded-[2rem] border border-white/40 bg-white/70 shadow-xl shadow-slate-900/10 backdrop-blur"
  >
    <div
      class="bg-gradient-to-r from-slate-950 via-slate-900 to-emerald-950 px-6 py-6 text-white sm:px-8"
    >
      <div
        class="flex flex-col gap-6 lg:flex-row lg:items-end lg:justify-between"
      >
        <div class="space-y-3">
          <a
            routerLink="/"
            class="inline-flex w-fit rounded-full border border-white/15 bg-white/10 px-4 py-2 text-xs font-semibold uppercase tracking-[0.28em] text-slate-200"
          >
            Autobrand Workspace
          </a>
          <div>
            <h1 class="font-['Fraunces'] text-3xl leading-tight text-white">
              Protected catalogue dashboard
            </h1>
            <p class="mt-2 max-w-2xl text-sm leading-6 text-slate-300">
              Product editing, invoice upload and scraper actions now require a
              valid authenticated session.
            </p>
          </div>
        </div>

        <div class="flex flex-col gap-3 sm:flex-row sm:items-center">
          <div class="rounded-2xl border border-white/10 bg-white/10 px-4 py-3">
            <p class="text-xs uppercase tracking-[0.24em] text-slate-300">
              Signed in as
            </p>
            <p class="mt-1 text-base font-semibold text-white">
              {{ user()?.username || 'User' }}
            </p>
          </div>

          <button
            type="button"
            class="inline-flex items-center justify-center rounded-2xl border border-white/15 bg-white/10 px-4 py-3 text-sm font-semibold text-white transition hover:bg-white/15"
            (click)="logout()"
          >
            Logout
          </button>
        </div>
      </div>
    </div>
  </header>

  <main class="flex-1">
    <router-outlet></router-outlet>
  </main>
</div>
