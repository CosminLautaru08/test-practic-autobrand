<div
  class="mx-auto flex min-h-screen w-full max-w-7xl flex-col px-4 py-6 sm:px-6 lg:px-8"
>
  <header
    class="mb-6 overflow-hidden rounded-[2rem] border border-white/40 bg-white/70 shadow-xl shadow-slate-900/10 backdrop-blur"
  >
    <div
      class="bg-gradient-to-r from-slate-950 via-slate-900 to-emerald-950 px-6 py-6 text-white sm:px-8"
    >
      <div
        class="flex flex-col gap-6 lg:flex-row lg:items-center lg:justify-between"
      >
        <div class="space-y-3">
          <a
            routerLink="/"
            class="inline-flex w-fit rounded-full border border-white/15 bg-white/10 px-4 py-2 text-xs font-semibold uppercase tracking-[0.28em] text-slate-200"
          >
            Autobrand Workspace
          </a>
          <div>
            <h1 class="font-['Fraunces'] text-3xl leading-tight text-white">
              Protected catalogue dashboard
            </h1>
          </div>
        </div>

        <div
          class="flex w-full flex-col gap-3 sm:w-auto sm:flex-row sm:items-stretch lg:self-center"
        >
          <div
            class="flex min-h-[4.75rem] min-w-[11.5rem] flex-1 flex-col justify-center rounded-2xl border border-white/10 bg-white/10 px-4 py-3"
          >
            <p class="text-xs uppercase tracking-[0.24em] text-slate-300">
              Signed in as
            </p>
            <p class="mt-1 text-base font-semibold text-white">
              {{ user()?.username || 'User' }}
            </p>
          </div>

          <button
            type="button"
            class="flex min-h-[4.75rem] min-w-[11.5rem] flex-1 flex-col justify-center rounded-2xl border border-white/15 bg-white/10 px-4 py-3 text-left text-white transition hover:bg-white/15 sm:text-center"
            (click)="logout()"
          >
            <span class="text-xs uppercase tracking-[0.24em] text-slate-300">
              Session
            </span>
            <span class="mt-1 text-base font-semibold text-white">Logout</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <main class="flex-1">
    <router-outlet></router-outlet>
  </main>
</div>
